<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secpurity Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --surface: #f8fafc; --ink: #0f172a; --text: #334155; --muted: #64748b; --faint: #94a3b8;
  --line: #e2e8f0; --line-soft: #f1f5f9;
  --accent: #4f46e5; --accent-hover: #4338ca; --accent-soft: #eef2ff; --accent-ink: #ffffff;
  --cve: #b91c1c; --cve-soft: #fef2f2; --hot: #b45309; --hot-soft: #fffbeb;
  --radius: 14px; --pill: 999px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 4px 16px rgba(15, 23, 42, .04);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
button, input, select { font-family: var(--font); }

/* Top bar */
.topbar { border-bottom: 1px solid var(--line); background: rgba(255,255,255,.9); backdrop-filter: blur(8px); }
.topbar-inner { max-width: 1240px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.logo svg { width: 34px; height: 34px; flex: none; }
.logo-word { font-weight: 700; font-size: 20px; letter-spacing: -.02em; }
.logo-word span { color: var(--accent); }
.period { font-size: 13px; font-weight: 500; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: var(--pill); padding: 6px 12px; }

/* Hero */
.hero { max-width: 1240px; margin: 0 auto; padding: 32px 16px 8px; }
h1 { margin: 0; color: var(--ink); font-weight: 700; font-size: clamp(24px, 4vw, 32px); letter-spacing: -.025em; line-height: 1.15; }
.sub { color: var(--muted); font-size: 15px; margin-top: 6px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
.stat { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; background: var(--bg); }
.stat b { display: block; color: var(--ink); font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--muted); }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, 1fr); } }

/* Layout */
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; max-width: 1240px; margin: 0 auto; padding: 20px 16px 64px; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; gap: 16px; } aside { position: static !important; max-height: none !important; } .toolbar { position: static; } }
aside { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
aside h3 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 20px 0 10px; display: flex; justify-content: space-between; align-items: center; }
aside h3 button { font-size: 12px; font-weight: 500; text-transform: none; letter-spacing: 0; }
input[type=search], input[type=date], select { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-size: 14px; transition: border-color .15s, box-shadow .15s; }
input[type=search]:focus, input[type=date]:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.chip:focus-visible, .btn:focus-visible, button.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: var(--pill); padding: 5px 10px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--faint)); flex: none; }
.chip:hover { border-color: var(--faint); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip .n { color: var(--faint); font-weight: 500; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .n { color: var(--accent); opacity: .7; }
button.link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; border-radius: 4px; }
label.toggle { display: flex; gap: 8px; align-items: center; font-size: 14px; margin-top: 12px; cursor: pointer; color: var(--text); }
label.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; position: sticky; top: 8px; z-index: 2; box-shadow: var(--shadow); }
.toolbar .count { font-size: 14px; font-weight: 500; color: var(--muted); margin-right: auto; font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: var(--pill); padding: 7px 14px; cursor: pointer; font-size: 13.5px; font-weight: 500; transition: background .15s, border-color .15s; }
.btn:hover:not(:disabled) { background: var(--surface); border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn:disabled { opacity: .45; cursor: default; }
.toolbar select { width: auto; border-radius: var(--pill); padding: 7px 12px; font-size: 13.5px; font-weight: 500; }

/* Groups and cards */
h2.group { color: var(--ink); font-size: 18px; font-weight: 600; letter-spacing: -.01em; margin: 28px 0 12px; display: flex; gap: 10px; align-items: center; }
h2.group::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--accent)); flex: none; }
h2.group span { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--line-soft); border-radius: var(--pill); padding: 2px 9px; }
article { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 10px; display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 4px 12px; transition: border-color .15s, box-shadow .15s; }
article:hover { box-shadow: var(--shadow); border-color: #cbd5e1; }
article.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
article input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--accent); }
article h4 { margin: 0; font-size: 16.5px; font-weight: 600; line-height: 1.4; letter-spacing: -.01em; }
article h4 a { color: var(--ink); text-decoration: none; }
article h4 a:hover { color: var(--accent); }
.meta { font-size: 13px; color: var(--muted); margin: 3px 0 8px; }
.meta .src { color: var(--text); font-weight: 600; }
.summary { font-size: 14.5px; margin: 0; color: var(--text); overflow-wrap: anywhere; max-width: 80ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; line-height: 1; padding: 5px 10px; border-radius: var(--pill); background: color-mix(in srgb, var(--c, var(--accent)) 10%, white); color: color-mix(in srgb, var(--c, var(--accent)) 85%, black); }
.tag.ind { background: var(--line-soft); color: var(--text); }
.tag.loc { background: var(--bg); border: 1px solid var(--line); color: var(--muted); padding: 4px 9px; }
.tag.loc::before { content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid currentColor; }
.tag.cve { background: var(--cve-soft); color: var(--cve); font-variant-numeric: tabular-nums; }
.tag.hot { background: var(--hot-soft); color: var(--hot); font-weight: 600; }
.errors { border: 1px solid #fde68a; background: var(--hot-soft); color: var(--hot); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; margin-bottom: 12px; }
.errors summary { cursor: pointer; font-weight: 600; }
.empty { color: var(--muted); text-align: center; padding: 56px 0; font-size: 15px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 8px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: var(--pill); font-size: 14px; font-weight: 500; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; box-shadow: 0 8px 24px rgba(15,23,42,.18); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="logo" aria-label="Secpurity">
        <svg viewBox="0 0 34 34" aria-hidden="true">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs>
          <rect width="34" height="34" rx="10" fill="url(#lg)"/>
          <path d="M17 7.5 10 10.2v5.3c0 4.6 3 8.6 7 10 4-1.4 7-5.4 7-10v-5.3L17 7.5Z" fill="#fff" fill-opacity=".22" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="m13.8 16.6 2.3 2.3 4.4-4.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="logo-word">Sec<span>purity</span></span>
      </div>
      <span class="period" id="period"></span>
    </div>
  </div>
  <div class="hero">
    <h1>Security news digest</h1>
    <div class="sub" id="sub"></div>
    <div class="stats" id="stats"></div>
  </div>
</header>
<div class="layout">
  <aside>
    <input type="search" id="q" placeholder="Search titles, summaries, CVEs…" aria-label="Search">
    <h3>Category <button class="link" data-clear="topics">clear</button></h3>
    <div class="chips" id="topics"></div>
    <h3>Industry <button class="link" data-clear="industries">clear</button></h3>
    <div class="chips" id="industries"></div>
    <h3>Location <button class="link" data-clear="locations">clear</button></h3>
    <div class="chips" id="locations"></div>
    <h3>Source</h3>
    <select id="source"><option value="">All sources</option></select>
    <h3>Published on or after</h3>
    <input type="date" id="from">
    <label class="toggle"><input type="checkbox" id="cveOnly"> Only articles mentioning CVEs</label>
    <label class="toggle"><input type="checkbox" id="selOnly"> Only selected articles</label>
  </aside>
  <main>
    <div id="errors"></div>
    <div class="toolbar">
      <span class="count" id="count"></span>
      <select id="group" aria-label="Group by">
        <option value="topic">Group by category</option>
        <option value="industry">Group by industry</option>
        <option value="location">Group by location</option>
        <option value="date">Group by day</option>
        <option value="source">Group by source</option>
        <option value="none">No grouping</option>
      </select>
      <button class="btn" id="selAll">Select visible</button>
      <button class="btn" id="selNone">Clear selection</button>
      <button class="btn primary" id="copy">Copy as Markdown</button>
      <button class="btn" id="download">Download .md</button>
    </div>
    <div id="list"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const DATA = /*__DATA__*/null;
const $ = (id) => document.getElementById(id);
const topicName = Object.fromEntries(DATA.topics.map(t => [t.id, t.name]));
const indName = Object.fromEntries(DATA.industries.map(t => [t.id, t.name]));
const locName = Object.fromEntries(DATA.locations.map(t => [t.id, t.name]));
const arts = DATA.articles.map((a, i) => ({ ...a, i, date: a.published ? new Date(a.published) : null }));
const state = { topics: new Set(), industries: new Set(), locations: new Set(), selected: new Set() };
const store = (() => { try { return window.localStorage; } catch (e) { return null; } })();
const KEY = "secnews-selected:" + DATA.generated;
try { JSON.parse(store?.getItem(KEY) || "[]").forEach(l => { const a = arts.find(x => x.link === l); if (a) state.selected.add(a.i); }); } catch (e) {}
const save = () => { try { store?.setItem(KEY, JSON.stringify([...state.selected].map(i => arts[i].link))); } catch (e) {} };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u) ? u : "#";
const fmtDate = (d) => d ? d.toISOString().slice(0, 10) : "undated";

const nSources = new Set(arts.map(a => a.source)).size;
$("period").textContent = DATA.period;
$("sub").textContent = `Articles from ${nSources} sources, tagged by category, industry and location.`;
$("stats").innerHTML = [
  [arts.length, "Articles"], [nSources, "Sources"],
  [new Set(arts.flatMap(a => a.cves)).size, "CVEs cited"],
  [arts.filter(a => a.also_reported_by.length).length, "Multi-outlet stories"],
].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
// One colour per topic, used for chip/card/group strips.
const PALETTE = ["#4f46e5", "#e11d48", "#7c3aed", "#0d9488", "#2563eb", "#db2777", "#d97706", "#0891b2", "#65a30d", "#9333ea", "#475569", "#059669", "#64748b"];
const topicColor = Object.fromEntries(DATA.topics.map((t, i) => [t.id, PALETTE[i % PALETTE.length]]));

const errs = Object.entries(DATA.errors || {});
if (errs.length) {
  $("errors").innerHTML = `<details class="errors"><summary>${errs.length} source(s) could not be fetched</summary><ul>${errs.map(([s, e]) => `<li><b>${esc(s)}</b>: ${esc(e)}</li>`).join("")}</ul></details>`;
}

function buildChips(el, items, key, field) {
  const counts = {};
  arts.forEach(a => a[field].forEach(id => counts[id] = (counts[id] || 0) + 1));
  el.innerHTML = items.filter(t => counts[t.id]).map(t =>
    `<button class="chip" aria-pressed="false" data-id="${t.id}"${field === "topics" ? ` style="--c:${topicColor[t.id]}"` : ""}>${esc(t.name)}<span class="n">${counts[t.id]}</span></button>`).join("") || '<span class="sub">none</span>';
  el.addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    const s = state[key], id = b.dataset.id;
    s.has(id) ? s.delete(id) : s.add(id);
    b.setAttribute("aria-pressed", s.has(id));
    draw();
  });
}
buildChips($("topics"), DATA.topics, "topics", "topics");
buildChips($("industries"), DATA.industries, "industries", "industries");
buildChips($("locations"), DATA.locations, "locations", "locations");
document.querySelectorAll("[data-clear]").forEach(b => b.addEventListener("click", () => {
  state[b.dataset.clear].clear();
  $(b.dataset.clear).querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));
  draw();
}));
[...new Set(arts.map(a => a.source))].sort().forEach(s => $("source").insertAdjacentHTML("beforeend", `<option>${esc(s)}</option>`));
["q", "source", "from", "cveOnly", "selOnly", "group"].forEach(id => $(id).addEventListener("input", draw));

function visible() {
  const q = $("q").value.trim().toLowerCase(), src = $("source").value, from = $("from").value;
  return arts.filter(a =>
    (!state.topics.size || a.topics.some(t => state.topics.has(t))) &&
    (!state.industries.size || a.industries.some(t => state.industries.has(t))) &&
    (!state.locations.size || a.locations.some(t => state.locations.has(t))) &&
    (!src || a.source === src) &&
    (!from || (a.date && fmtDate(a.date) >= from)) &&
    (!$("cveOnly").checked || a.cves.length) &&
    (!$("selOnly").checked || state.selected.has(a.i)) &&
    (!q || (a.title + " " + a.summary + " " + a.cves.join(" ") + " " + a.source).toLowerCase().includes(q)));
}

function groupKey(a, mode) {
  if (mode === "topic") {
    const active = state.topics.size ? a.topics.find(t => state.topics.has(t)) : null;
    return [active || a.topics[0]];
  }
  if (mode === "industry") return a.industries.length ? [a.industries[0]] : ["_none"];
  if (mode === "location") {
    const active = state.locations.size ? a.locations.find(t => state.locations.has(t)) : null;
    return [active || a.locations[0] || "_none"];
  }
  if (mode === "date") return [fmtDate(a.date)];
  if (mode === "source") return [a.source];
  return [""];
}
function groupLabel(k, mode) {
  if (mode === "topic") return topicName[k] || k;
  if (mode === "industry") return k === "_none" ? "No specific industry" : indName[k];
  if (mode === "location") return k === "_none" ? "No specific location" : locName[k];
  return k;
}
function groupOrder(mode) {
  if (mode === "topic") return DATA.topics.map(t => t.id);
  if (mode === "industry") return DATA.industries.map(t => t.id).concat("_none");
  if (mode === "location") return DATA.locations.map(t => t.id).concat("_none");
  return null;
}

function card(a) {
  const tags = a.topics.filter(t => t !== "general").map(t => `<span class="tag" style="--c:${topicColor[t]}">${esc(topicName[t])}</span>`)
    .concat(a.industries.map(t => `<span class="tag ind">${esc(indName[t])}</span>`))
    .concat(a.locations.map(t => `<span class="tag loc">${esc(locName[t])}</span>`))
    .concat(a.cves.map(c => `<span class="tag cve">${esc(c)}</span>`));
  if (a.also_reported_by.length) tags.unshift(`<span class="tag hot" title="${esc(a.also_reported_by.join(", "))}">${a.also_reported_by.length + 1} outlets</span>`);
  const sel = state.selected.has(a.i);
  return `<article class="${sel ? "sel" : ""}" data-i="${a.i}" style="--c:${topicColor[a.topics[0]] || "var(--rule)"}">
    <input type="checkbox" ${sel ? "checked" : ""} aria-label="Select for bulletin">
    <div><h4><a href="${esc(safeUrl(a.link))}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h4>
    <div class="meta"><span class="src">${esc(a.source)}</span> · ${fmtDate(a.date)}${a.also_reported_by.length ? " · also: " + esc(a.also_reported_by.join(", ")) : ""}</div>
    ${a.summary ? `<p class="summary">${esc(a.summary)}</p>` : ""}
    ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}</div></article>`;
}

function draw() {
  const list = visible(), mode = $("group").value;
  $("count").textContent = `${list.length} shown · ${state.selected.size} selected`;
  $("copy").disabled = $("download").disabled = !state.selected.size;
  if (!list.length) { $("list").innerHTML = '<p class="empty">No articles match these filters.</p>'; return; }
  const groups = new Map();
  list.forEach(a => groupKey(a, mode).forEach(k => { if (!groups.has(k)) groups.set(k, []); groups.get(k).push(a); }));
  let keys = [...groups.keys()];
  const order = groupOrder(mode);
  if (order) keys.sort((x, y) => order.indexOf(x) - order.indexOf(y));
  else if (mode === "date") keys.sort().reverse();
  else keys.sort();
  $("list").innerHTML = keys.map(k => (mode === "none" ? "" : `<h2 class="group"${mode === "topic" ? ` style="--c:${topicColor[k]}"` : ""}>${esc(groupLabel(k, mode))} <span>${groups.get(k).length}</span></h2>`)
    + groups.get(k).map(card).join("")).join("");
}

$("list").addEventListener("change", (e) => {
  if (e.target.type !== "checkbox") return;
  const el = e.target.closest("article"), i = +el.dataset.i;
  e.target.checked ? state.selected.add(i) : state.selected.delete(i);
  el.classList.toggle("sel", e.target.checked);
  save();
  $("count").textContent = `${visible().length} shown · ${state.selected.size} selected`;
  $("copy").disabled = $("download").disabled = !state.selected.size;
});
$("selAll").addEventListener("click", () => { visible().forEach(a => state.selected.add(a.i)); save(); draw(); });
$("selNone").addEventListener("click", () => { state.selected.clear(); save(); draw(); });

function markdown() {
  const chosen = arts.filter(a => state.selected.has(a.i));
  const byTopic = new Map();
  chosen.forEach(a => {
    const k = (state.topics.size && a.topics.find(t => state.topics.has(t))) || a.topics[0];
    if (!byTopic.has(k)) byTopic.set(k, []); byTopic.get(k).push(a);
  });
  const order = DATA.topics.map(t => t.id);
  const lines = [`# Threat Intelligence Bulletin`, ``, `_Period: ${DATA.period}_`, ``];
  [...byTopic.keys()].sort((x, y) => order.indexOf(x) - order.indexOf(y)).forEach(k => {
    lines.push(`## ${topicName[k]}`, ``);
    byTopic.get(k).forEach(a => {
      lines.push(`### ${a.title}`);
      const meta = [`Source: [${a.source}](${a.link})`, fmtDate(a.date)];
      if (a.also_reported_by.length) meta.push(`also reported by ${a.also_reported_by.join(", ")}`);
      lines.push(meta.join(" · ") + "  ");
      if (a.industries.length) lines.push(`Sectors: ${a.industries.map(i => indName[i]).join(", ")}  `);
      if (a.locations.length) lines.push(`Locations: ${a.locations.map(l => locName[l]).join(", ")}  `);
      if (a.cves.length) lines.push(`CVEs: ${a.cves.join(", ")}  `);
      if (a.summary) lines.push(``, a.summary);
      lines.push(``);
    });
  });
  return lines.join("\n");
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); }
$("copy").addEventListener("click", async () => {
  const md = markdown();
  try { await navigator.clipboard.writeText(md); toast("Copied " + state.selected.size + " articles"); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = md; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Copied"); }
});
$("download").addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob([markdown()], { type: "text/markdown" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: `bulletin-${new Date().toISOString().slice(0, 10)}.md` });
  a.click(); URL.revokeObjectURL(url);
});
draw();
</script>
