# TEMPORARY: checks story grouping against the real article archive (read-only). Removed before merging.
name: Story grouping check

on:
  push:
    branches: [feature/story-grouping]
    paths: [secnews/**, .github/workflows/story-check.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore article archive (read-only)
        uses: actions/cache/restore@v4
        with:
          path: .secnews
          key: secnews-archive-none
          restore-keys: secnews-archive-
      - name: Show story groups
        run: |
          python - <<'PY'
          import time
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from secnews.archive import load_archive
          from secnews.classify import Classifier, deduplicate
          from secnews.config import load_sources, load_taxonomy
          from secnews.stories import group_stories
          arts = load_archive(Path(".secnews/archive.json"))
          c = Classifier(load_taxonomy(None), load_sources(None))
          for a in arts: c.classify(a)
          arts = deduplicate(arts)
          t = time.time(); n = group_stories(arts); took = time.time() - t
          groups = defaultdict(list)
          for a in arts: groups[a.story].append(a)
          multi = [g for g in groups.values() if len(g) > 1]
          print(f"{len(arts)} articles, {len(groups)} stories, {n} with several articles, {sum(map(len, multi))} articles in them; grouping took {took:.1f}s")
          recent = datetime.now(timezone.utc) - timedelta(days=10)
          multi = [g for g in multi if max(a.published for a in g) >= recent]
          multi.sort(key=len, reverse=True)
          for g in multi[:70]:
              g.sort(key=lambda a: a.published)
              print(f"\n=== {len(g)} articles")
              for a in g:
                  print(f"  {a.published:%d %b %H:%M} | {a.source[:22]:22} | {a.title[:110]}")
          from secnews.stories import _house_words
          hw = _house_words([a for a in arts if a.published])
          print("\n\n### Outlet boilerplate words")
          for src in sorted(hw, key=lambda s: -len(hw[s]))[:15]:
              print(f"  {src}: {', '.join(sorted(hw[src])[:25])}")
          print("\n\n### HIPAA Journal tagging (last 10 days)")
          for a in arts:
              if a.source == "HIPAA Journal" and a.published >= recent:
                  print(f"  {'HEALTHCARE' if 'healthcare' in a.industries else '-':10} | {a.title[:100]}")
          PY
