# Sends the daily briefing every morning. Add repository secrets (Settings > Secrets and variables > Actions)
# for ONE of these:
#   Buttondown (newsletter service):  SECNEWS_BUTTONDOWN_API_KEY
#     Buttondown sends to everyone on your Buttondown list; no subscriber secret needed.
#   Email account (SMTP):  SECNEWS_SMTP_HOST, SECNEWS_SMTP_USER, SECNEWS_SMTP_PASSWORD
#     (optional SECNEWS_SMTP_FROM, SECNEWS_SMTP_PORT, SECNEWS_SMTP_SECURITY)
#     plus SECNEWS_SUBSCRIBERS: one email address per line (kept secret so the list isn't in the repo)
# Scheduled runs only start once this file is on the default branch (main).
name: Daily briefing email

on:
  schedule:
    # Delivered at 09:00 UK time every day. GitHub schedules are in UTC and ignore summer time, so the
    # job runs early (08:17 UK in summer, 07:17 in winter), builds the briefing and has Buttondown send it
    # at exactly 09:00 (an email account waits until 09:00 instead). The second run is a backup in case
    # GitHub skips or badly delays the first; --once-per-day stops it sending twice.
    - cron: "17 7 * * *"
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      forget_sent_day:
        description: "Instead of sending, undo the briefing sent on this day (YYYY-MM-DD, e.g. a test) so its stories can go out again"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: secnews-archive
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore article archive
        uses: actions/cache/restore@v4
        with:
          path: .secnews
          key: secnews-archive-${{ github.run_id }}
          restore-keys: secnews-archive-

      - name: Send the briefing
        env:
          SECNEWS_BUTTONDOWN_API_KEY: ${{ secrets.SECNEWS_BUTTONDOWN_API_KEY }}
          SECNEWS_SMTP_HOST: ${{ secrets.SECNEWS_SMTP_HOST }}
          SECNEWS_SMTP_PORT: ${{ secrets.SECNEWS_SMTP_PORT }}
          SECNEWS_SMTP_USER: ${{ secrets.SECNEWS_SMTP_USER }}
          SECNEWS_SMTP_PASSWORD: ${{ secrets.SECNEWS_SMTP_PASSWORD }}
          SECNEWS_SMTP_FROM: ${{ secrets.SECNEWS_SMTP_FROM }}
          SECNEWS_SMTP_SECURITY: ${{ secrets.SECNEWS_SMTP_SECURITY }}
          SUBSCRIBERS: ${{ secrets.SECNEWS_SUBSCRIBERS }}
          FORGET_SENT_DAY: ${{ inputs.forget_sent_day }}
        run: |
          if [ -n "$FORGET_SENT_DAY" ]; then
            python -m secnews briefing --archive .secnews/archive.json --forget-sent "$FORGET_SENT_DAY"
            exit 0
          fi
          printf '%s\n' "$SUBSCRIBERS" | tr ',;' '\n\n' > subscribers.txt
          python -m secnews briefing --archive .secnews/archive.json --subscribers subscribers.txt \
            --send --at 09:00 --once-per-day -o briefing.html
          rm -f subscribers.txt

      - name: Save article archive
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .secnews
          key: secnews-archive-${{ github.run_id }}

      - name: Keep a copy of the email
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing
          path: briefing.html
          if-no-files-found: ignore
          retention-days: 14
